<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="music-container">

    <button id="playBtn">
        🎵
    </button>

    <div id="controls" class="hidden">

        <audio id="audio" loop>
            <source src="../../assets/audio/background.mp3" type="audio/mp3">
        </audio>

        <button id="toggle">
            ▶
        </button>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
